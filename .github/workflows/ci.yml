name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lts
            node-version: lts/*
          - name: current
            node-version: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  release:
    # Every push to main that passes the tests is a release candidate.
    # semantic-release decides from the commits whether it is a release.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag, create the GitHub release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads every commit since the last tag
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          before=$(git tag --points-at HEAD --list 'v*')
          # The preset stays on 9.x. From 10.x it renders only with
          # conventional-changelog-writer 9, and semantic-release 25's
          # release-notes-generator 14 still loads writer 8: generateNotes
          # then fails with "requires conventional-changelog-writer@9".
          # Move to 10.x only together with a release-notes-generator that
          # depends on writer 9.
          npx --yes \
            -p semantic-release@25.0.9 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
          after=$(git tag --points-at HEAD --list 'v*')
          # Only a tag this run created. A tag someone pushed by hand onto
          # the same commit must never be announced below.
          created=$(comm -13 <(echo "$before" | sort) <(echo "$after" | sort))
          echo "tag=${created}" >> "$GITHUB_OUTPUT"
      - name: verify the version on npm
        # Non-fatal: by this point the release is already public.
        if: steps.release.outputs.tag != ''
        continue-on-error: true
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          npm view "@cnips/table@${version}" version
